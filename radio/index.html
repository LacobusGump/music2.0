<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.png">
<title>The H(y)m? Album · GUMP</title>
<meta name="description" content="Listen to The H(y)m?, an album of AI-generated music.">
<style>
*{box-sizing:border-box}body{margin:0;background:#171512;color:#f7efdF;font:1rem/1.5 system-ui,sans-serif}main{max-width:48rem;padding:2rem clamp(1.2rem,5vw,3rem) 4rem;margin:auto}a{color:inherit}nav{display:flex;gap:1.2rem;font-size:.9rem}header{display:flex;align-items:center;gap:clamp(1rem,4vw,2.5rem);margin:3rem 0 2rem}header img{width:30%;aspect-ratio:1;object-fit:cover}h1{font:normal clamp(2.1rem,7vw,4.5rem)/1.05 Georgia,serif;margin:0}header p{color:#cfbc9f}button{font:inherit;color:inherit;cursor:pointer}audio{width:100%;margin:.5rem 0 1rem}ol{list-style:none;counter-reset:track;margin:1rem 0;padding:0}li{counter-increment:track;display:flex;align-items:center;border-top:1px solid #494237}li button{flex:1;display:flex;align-items:center;gap:1rem;text-align:left;border:0;background:transparent;padding:.8rem .5rem}li button:before{content:counter(track,decimal-leading-zero);font-size:.8rem;color:#bcaa8f;font-variant-numeric:tabular-nums}li button[aria-current=true]{color:#ffd391;background:#29251f}button:focus-visible,a:focus-visible{outline:2px solid #ffd391}.download,#own-album{font-size:.85rem}#own-album{background:transparent;border:1px solid #87785f;padding:.6rem 1rem;border-radius:4px}#now{font-weight:600;margin-bottom:.2rem}
</style><link rel="stylesheet" href="/assets/studio.css">
</head><body><main>
<nav><a href="/">GUMP</a><a href="/products/">Music Apps</a></nav>
<header><img src="/img/drum_cover.jpg" alt="Album cover"><div><h1>The H(y)m?</h1><p>AI-generated music</p></div></header>
<p id="now" aria-live="polite"></p><audio id="audio" controls preload="metadata"></audio>
<ol id="tracks" aria-label="Album tracks"></ol>
<button id="own-album">Download album · $30</button>
<script src="/js/playlist.js"></script>
<script>
(function(){
  'use strict';
  const R=window.RADIO, PLAY=R.list;
  const audio=document.querySelector('audio'), list=document.querySelector('#tracks');
  const params=new URLSearchParams(location.search);
  const requested=params.has('i')?Number(params.get('i')):R.indexFor(params.get('start'));
  let idx=Number.isInteger(requested)&&requested>=0&&requested<PLAY.length?requested:0;
  let fallback=false, wantsPlay=false;
  var LINK_ALBUM = 'https://buy.stripe.com/fZu00jfy05ctdNz1zGfIs0g'; // $30 — the album, to keep

  function _slug(p){ return (p.f||'').split('/').pop().replace(/\.[^.]+$/,''); }
  function _unlocks(){ try{ return JSON.parse(localStorage.getItem('gump_unlocks')||'{}'); }catch(e){ return {}; } }
  function ownsAlbum(){ return !!_unlocks().all; }
  function ownsSong(p){ return ownsAlbum() || !!_unlocks()[_slug(p)]; }   // love bugs grant single files
  function unlockSong(slug){ var u=_unlocks(); u[slug]=true; localStorage.setItem('gump_unlocks',JSON.stringify(u)); }
  // merges instead of replacing — a love-bug song shouldn't get wiped out by
  // buying the album on top of it. purchasedAt is kept as the receipt date.
  function unlockAll(){ var u=_unlocks(); u.all=true; u.purchasedAt=Date.now(); localStorage.setItem('gump_unlocks',JSON.stringify(u)); }
  function dlName(t){ return String(t).replace(/[^\w \-()'!?.]/g,'').trim()+'.mp3'; }
  function buyAlbum(){ sessionStorage.setItem('gump_album_pend',JSON.stringify({ts:Date.now()})); if(LINK_ALBUM) location.href=LINK_ALBUM; }
  // download the whole thing, one file at a time — same-origin, so the
  // browser saves instead of navigating. Staggered so it doesn't get eaten.
  function downloadAlbum(){
    var files=[];
    PLAY.forEach(function(p){ if(p.f) files.push({f:p.f, n:dlName(p.t)}); });
    (R.beats||[]).forEach(function(b){ if(b.f) files.push({f:b.f, n:dlName(b.t)}); });
    var k=0;
    (function next(){
      if(k>=files.length) return;
      var a2=document.createElement('a');
      a2.href=files[k].f; a2.download=files[k].n;
      document.body.appendChild(a2); a2.click(); a2.remove();
      k++; setTimeout(next, 600);
    })();
  }
  // handle return from Stripe
  (function(){
    var ps=new URLSearchParams(location.search);
    var unl=ps.get('unlocked'), paid=ps.get('paid');
    if(unl==='all'){
      try{
        var apend=JSON.parse(sessionStorage.getItem('gump_album_pend')||'null');
        if(apend&&(Date.now()-apend.ts<1800000)){ unlockAll(); sessionStorage.removeItem('gump_album_pend'); }
      }catch(e){}
    }
    else if(paid==='1'){
      try{
        var pend=JSON.parse(sessionStorage.getItem('gump_pend')||'null');
        if(pend&&pend.slug&&(Date.now()-pend.ts<1800000)){ unlockSong(pend.slug); sessionStorage.removeItem('gump_pend'); }
      }catch(e){}
    }
    if(unl||paid) history.replaceState({},'',location.pathname);
  })();

  const albumButton=document.querySelector('#own-album');
  if(ownsAlbum()) albumButton.textContent='Download album';
  albumButton.onclick=ownsAlbum()?downloadAlbum:buyAlbum;
  const buttons=PLAY.map((track,i)=>{
    const row=document.createElement('li'), button=document.createElement('button');
    button.textContent=track.t;
    button.onclick=()=>select(i,true);
    row.append(button);
    if(ownsSong(track)){
      const link=document.createElement('a');
      link.className='download';link.href=track.f;link.download=dlName(track.t);
      link.textContent='Download';link.setAttribute('aria-label','Download '+track.t);row.append(link);
    }
    list.append(row);return button;
  });
  function play(){audio.play().catch(()=>{});}
  function select(i,start){
    idx=i; fallback=false; wantsPlay=start;
    buttons.forEach((button,n)=>button.setAttribute('aria-current',String(n===i)));
    document.querySelector('#now').textContent=PLAY[i].t;
    audio.src=(R.cdn||'')+PLAY[i].f;
    if(start) play();
  }
  audio.addEventListener('play',()=>{wantsPlay=true;});
  audio.addEventListener('pause',()=>{if(!audio.error&&!audio.ended) wantsPlay=false;});
  audio.addEventListener('error',()=>{
    if(R.cdn&&!fallback){fallback=true; audio.src=PLAY[idx].f; if(wantsPlay) play();}
    else document.querySelector('#now').textContent=PLAY[idx].t+' · Audio unavailable';
  });
  audio.addEventListener('ended',()=>{if(idx+1<PLAY.length) select(idx+1,true);});
  select(idx,params.has('i')||params.has('start'));
})();
</script></main></body></html>
