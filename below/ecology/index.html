function u(b){return Uint8Array.from(atob(b),function(c){return c.charCodeAt(0)})}
async function o(pw){
 var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 var k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(S),iterations:I,hash:'SHA-256'},km,
   {name:'AES-GCM',length:256},false,['decrypt']);
 var r=u(B);
 var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:r.slice(0,12)},k,r.slice(12));
 return new TextDecoder().decode(pt);
}
function show(h,pw){try{localStorage.setItem('gump_below',pw)}catch(e){}
 document.open();document.write(h);document.close();}
async function go(){
 var pw=document.getElementById('p').value;
 try{show(await o(pw),pw)}
 catch(e){var el=document.getElementById('e');el.textContent='not quite';
  document.getElementById('p').value='';setTimeout(function(){el.textContent=''},1800);}
}
document.getElementById('p').addEventListener('keydown',function(e){if(e.key==='Enter')go()});
var v=null;try{v=localStorage.getItem('gump_below')}catch(e){}
if(v){o(v).then(function(h){show(h,v)}).catch(function(){document.getElementById('p').focus()});}
else{document.getElementById('p').focus();}
})();
</script></body></html>
