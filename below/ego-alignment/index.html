function u(b){return Uint8Array.from(atob(b),function(c){return c.charCodeAt(0)})}
async function o(pw){
 var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 var k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(S),iterations:I,hash:'SHA-256'},km,
   {name:'AES-GCM',length:256},false,['decrypt']);
 var r=u(B);
 var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:r.slice(0,12)},k,r.slice(12));
 return new TextDecoder().decode(pt);
}
